version: '3.9'

services:
  # ── Databases ──────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: aveon_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootpassword}
    networks:
      - aveon_net
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:latest
    container_name: aveon_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-rootpassword}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-rootpassword}@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - aveon_net

  redis:
    image: redis:7-alpine
    container_name: aveon_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - aveon_net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Message Broker (Kafka KRaft — no Zookeeper) ────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: aveon_kafka
    restart: unless-stopped
    ports:
      - "29092:29092"   # host-accessible (for local dev / tools)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: aveon-kafka-cluster-001
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - aveon_net
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: aveon_kafka_ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: aveon-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - aveon_net

  # ── Microservices ──────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: packages/auth-service/Dockerfile
    container_name: aveon_auth
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AUTH_PORT: 3001
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-rootpassword}@mongo:27017/auth_db?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: 15m
      REFRESH_TOKEN_EXPIRY: 604800
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      KAFKA_BROKER: kafka:9092
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - aveon_net

  poll-service:
    build:
      context: .
      dockerfile: packages/poll-service/Dockerfile
    container_name: aveon_poll
    restart: unless-stopped
    environment:
      NODE_ENV: production
      POLL_PORT: 3002
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-rootpassword}@mongo:27017/poll_db?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BROKER: kafka:9092
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - aveon_net

  vote-service:
    build:
      context: .
      dockerfile: packages/vote-service/Dockerfile
    container_name: aveon_vote
    restart: unless-stopped
    environment:
      NODE_ENV: production
      VOTE_PORT: 3003
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-rootpassword}@mongo:27017/vote_db?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      POLL_SERVICE_URL: http://poll-service:3002
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      poll-service:
        condition: service_started
    networks:
      - aveon_net

  notification-service:
    build:
      context: .
      dockerfile: packages/notification-service/Dockerfile
    container_name: aveon_notif
    restart: unless-stopped
    environment:
      NODE_ENV: production
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      KAFKA_BROKER: kafka:9092
      NOTIFY_ALL_EMAIL: ${NOTIFY_ALL_EMAIL:-}
      # Email rate limiting (adjust if needed)
      EMAIL_RATE_PER_SECOND: ${EMAIL_RATE_PER_SECOND:-1}
      EMAIL_RATE_PER_MINUTE: ${EMAIL_RATE_PER_MINUTE:-10}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - aveon_net

  monitor-service:
    build:
      context: .
      dockerfile: packages/monitor-service/Dockerfile
    container_name: aveon_monitor
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONITOR_PORT: 3005
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aveon_net

  gateway:
    build:
      context: .
      dockerfile: packages/gateway/Dockerfile
    container_name: aveon_gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth-service:3001
      POLL_SERVICE_URL: http://poll-service:3002
      VOTE_SERVICE_URL: http://vote-service:3003
      MONITOR_SERVICE_URL: http://monitor-service:3005
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      poll-service:
        condition: service_started
      vote-service:
        condition: service_started
      monitor-service:
        condition: service_started
    networks:
      - aveon_net

volumes:
  mongo_data:
  redis_data:
  kafka_data:

networks:
  aveon_net:
    driver: bridge
