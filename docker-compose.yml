version: '3.9'

services:
  # ── Databases ──────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: aveon_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootpassword}
    networks:
      - aveon_net
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:latest
    container_name: aveon_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-rootpassword}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-rootpassword}@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - aveon_net

  redis:
    image: redis:7-alpine
    container_name: aveon_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - aveon_net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Microservices ──────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: packages/auth-service/Dockerfile
    container_name: aveon_auth
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AUTH_PORT: 3001
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-rootpassword}@mongo:27017/auth_db?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: 15m
      REFRESH_TOKEN_EXPIRY: 604800
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aveon_net

  poll-service:
    build:
      context: .
      dockerfile: packages/poll-service/Dockerfile
    container_name: aveon_poll
    restart: unless-stopped
    environment:
      NODE_ENV: production
      POLL_PORT: 3002
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-rootpassword}@mongo:27017/poll_db?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aveon_net

  vote-service:
    build:
      context: .
      dockerfile: packages/vote-service/Dockerfile
    container_name: aveon_vote
    restart: unless-stopped
    environment:
      NODE_ENV: production
      VOTE_PORT: 3003
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-rootpassword}@mongo:27017/vote_db?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      POLL_SERVICE_URL: http://poll-service:3002
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      poll-service:
        condition: service_started
    networks:
      - aveon_net

  notification-service:
    build:
      context: .
      dockerfile: packages/notification-service/Dockerfile
    container_name: aveon_notif
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NOTIF_PORT: 3004
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-rootpassword}@mongo:27017/auth_db?authSource=admin
      REDIS_URL: redis://redis:6379
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aveon_net

  gateway:
    build:
      context: .
      dockerfile: packages/gateway/Dockerfile
    container_name: aveon_gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth-service:3001
      POLL_SERVICE_URL: http://poll-service:3002
      VOTE_SERVICE_URL: http://vote-service:3003
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      poll-service:
        condition: service_started
      vote-service:
        condition: service_started
    networks:
      - aveon_net

volumes:
  mongo_data:
  redis_data:

networks:
  aveon_net:
    driver: bridge
